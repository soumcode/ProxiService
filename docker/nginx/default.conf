server {
    # Listen only inside the container; Compose publishes this port on host loopback.
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Serve Laravel's public directory and permit application file uploads up to 32 MB.
    root /var/www/html/public;
    index index.php;
    client_max_body_size 32m;

    # Send access and error logs to Docker's standard output and error streams.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Serve existing public files directly and send other requests to Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Do not expose hidden files such as environment files or Git metadata.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Execute only existing PHP files through the local PHP-FPM process.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }
}
