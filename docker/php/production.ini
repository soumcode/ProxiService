; Disable timestamp checks because production code is immutable between image builds.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000

; Match the Nginx upload limit and keep PHP memory usage bounded.
memory_limit=256M
upload_max_filesize=32M
post_max_size=34M
max_execution_time=60

; Write PHP errors to container logs instead of persistent local files.
log_errors=On
error_log=/proc/self/fd/2
